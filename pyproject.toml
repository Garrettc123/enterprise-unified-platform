[project]
name = "enterprise-unified-platform"
version = "2.0.0"
description = "Enterprise Platform - AI-Powered Multi-System Integration"
requires-python = ">=3.11"
authors = [
    { name = "Garrett Carrol", email = "garrett@enterprise.dev" }
]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "stripe>=9.0.0",
    "email-validator>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<5.0.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "aiosqlite>=0.19.0"
]

[project.urls]
Repository = "https://github.com/Garrettc123/enterprise-unified-platform"
