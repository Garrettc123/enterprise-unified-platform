name: Garcar v6 preview checks

on:
  pull_request:
    paths:
      - "garcar_core_v6/**"
      - "tests/test_garcar_core_v6.py"
      - ".github/workflows/garcar-v6-checks.yml"
  push:
    branches:
      - "feat/garcar-v6-durable-core"
    paths:
      - "garcar_core_v6/**"
      - "tests/test_garcar_core_v6.py"
      - ".github/workflows/garcar-v6-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: garcar_v6_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d garcar_v6_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GARCAR_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/garcar_v6_test
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/garcar_v6_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r garcar_core_v6/requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q garcar_core_v6 tests
      - name: Validate deployment shell syntax
        run: bash -n garcar_core_v6/deploy.sh
      - name: Apply isolated schema to disposable PostgreSQL
        run: |
          python - <<'PY'
          import asyncio
          import os
          from pathlib import Path
          import asyncpg

          async def main():
              conn = await asyncpg.connect(os.environ["GARCAR_TEST_DATABASE_URL"])
              try:
                  schema_sql = Path("garcar_core_v6/schema.sql").read_text()
                  await conn.execute(schema_sql)
                  # Verify that reapplying the isolated schema is safe.
                  await conn.execute(schema_sql)
              finally:
                  await conn.close()

          asyncio.run(main())
          PY
      - name: Run v6 unit and PostgreSQL integration tests
        run: pytest -q tests/test_garcar_core_v6.py
