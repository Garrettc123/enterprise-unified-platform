name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MONGODB_URI: mongodb://localhost:27017/test_db

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: ci_only_password_change_me

      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ci_only_password_change_me
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node Dependencies
        run: cd frontend && npm install --legacy-peer-deps

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Node Tests
        run: cd frontend && npm run test -- --run
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}
          DATABASE_URL: postgresql://test_user:ci_only_password_change_me@localhost:5432/test_db

      - name: Run Python Tests
        run: python -m pytest backend/tests/ -q
        env:
          MONGODB_URI: ${{ env.MONGODB_URI }}
          DATABASE_URL: postgresql://test_user:ci_only_password_change_me@localhost:5432/test_db

      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        if: always()

  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd frontend && npm install --legacy-peer-deps
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build
      - run: pip install flake8 black mypy 2>/dev/null || true
      - run: flake8 backend/ --select=E9,F63,F7,F82 --show-source --statistics

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [ test, lint-and-type-check ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        run: docker build -t app:latest .

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cd frontend && npm ci --legacy-peer-deps
      - run: cd frontend && npm audit --omit=dev --audit-level=high
      - run: pip install safety bandit
      - run: bandit -r backend -q

  deploy-production:
    name: Production deploy disabled pending real provider integration
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: false
    steps:
      - run: |
          echo "No production deploy configured. An echo command cannot be a deployment."
          exit 1
