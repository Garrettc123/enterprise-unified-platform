name: Revenue Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/routers/revenue.py"
      - "backend/revenue_agent.py"
      - "backend/tests/test_revenue.py"
      - ".github/workflows/auto-revenue.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-revenue-integrity:
    name: Verify revenue assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject unverified revenue reports and unsigned webhooks
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("backend/routers/revenue.py").read_text()
          required = [
              "Signed webhook processing is not configured",
              "Durable Stripe reconciliation has not been implemented",
              '"verified_mrr": None',
              '"verified_arr": None',
          ]
          for token in required:
              assert token in source, f"Revenue integrity protection missing: {token}"
          assert "accept but log warning" not in source
          print("Revenue truthfulness source checks passed")
          PY
